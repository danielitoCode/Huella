name: CI

on:
  push:
    branches: [master, main, core1]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run typecheck:node
      - run: npm test
      - run: npm run build

  huella-api:
    name: huella-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions/huella-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/huella-api/package.json
      - run: npm install
      - run: npm test

  huella-webhooks:
    name: huella-webhooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions/huella-webhooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/huella-webhooks/package.json
      - run: npm install
      - run: npm test

  CI:
    name: CI
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - web
      - huella-api
      - huella-webhooks

    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.web.result }}" != "success" ||
                "${{ needs.huella-api.result }}" != "success" ||
                "${{ needs.huella-webhooks.result }}" != "success" ]]; then
            echo "One or more CI checks failed."
            exit 1
          fi
          
          echo "All CI checks passed."